[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ios-research"
version = "0.1.0"
description = "Authorized iOS security research framework (CLI + LLM-agent driven)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Daniel Luedke" }]
keywords = ["security-research", "fuzzing", "ios", "crash-triage", "cli"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
ios-research = "ios_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "native: requires a real macOS toolchain/ASan runtime; opt-in, deselected in CI",
]

[tool.coverage.run]
branch = true
source = ["ios_research"]
